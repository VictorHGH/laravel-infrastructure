networks:
  laravel-docker:
    name: "${PROJECT_NAME}-net"

volumes:
  node_modules:

services:

  server:
    build:
      context: .
      dockerfile: dockerfiles/nginx.dockerfile
      args:
        NGINX_BASE_IMAGE: ${NGINX_BASE_IMAGE}
    ports:
      - "${WEB_PORT}:8080"
    depends_on:
      php:
        condition: service_started
    volumes:
      - ./src:/var/www/html:delegated
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - laravel-docker
    restart: unless-stopped

  php:
    user: ${UID:-1000}:${GID:-1000}
    build:
      context: .
      dockerfile: dockerfiles/php.dockerfile
      target: base
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
        INSTALL_XDEBUG: "true"
        PHP_BASE_IMAGE: ${PHP_BASE_IMAGE}
        XDEBUG_VERSION: ${XDEBUG_VERSION}
        REDIS_PECL_VERSION: ${REDIS_PECL_VERSION}
        COMPOSER_IMAGE_TAG: ${COMPOSER_IMAGE_TAG}
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      XDEBUG_MODE: debug,develop
      XDEBUG_CONFIG: client_host=host.docker.internal
    volumes:
      - ./src:/var/www/html:delegated
      - ./dockerfiles/php/opcache-dev.ini:/usr/local/etc/php/conf.d/opcache.ini:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - laravel-docker
    restart: unless-stopped

  scheduler:
    user: ${UID:-1000}:${GID:-1000}
    build:
      context: .
      dockerfile: dockerfiles/php.dockerfile
      target: base
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
        INSTALL_XDEBUG: "false"
        PHP_BASE_IMAGE: ${PHP_BASE_IMAGE}
        XDEBUG_VERSION: ${XDEBUG_VERSION}
        REDIS_PECL_VERSION: ${REDIS_PECL_VERSION}
        COMPOSER_IMAGE_TAG: ${COMPOSER_IMAGE_TAG}
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      php:
        condition: service_started
      mysql:
        condition: service_healthy
    volumes:
      - ./src:/var/www/html:delegated
    networks:
      - laravel-docker
    restart: unless-stopped

  node:
    image: node:20-alpine
    working_dir: /app
    command: ["sh", "-lc", "if [ -f package-lock.json ]; then if [ ! -d node_modules ] || [ ! -f node_modules/.package-lock.json ] || ! cmp -s package-lock.json node_modules/.package-lock.json; then npm ci && cp package-lock.json node_modules/.package-lock.json; fi; else if [ ! -d node_modules ]; then npm install; fi; fi; npm run dev -- --host 0.0.0.0 --port 5173"]
    volumes:
      - ./src:/app:delegated
      - node_modules:/app/node_modules
    ports:
      - "5173:5173"
    networks:
      - laravel-docker
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - laravel-docker

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:${PHPMYADMIN_IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${PMA_PORT}:80"
    environment:
      PMA_HOST: mysql
    networks:
      - laravel-docker

  composer:
    image: php:8.4-cli-alpine
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./src:/var/www/html
    working_dir: /var/www/html
    entrypoint: ["sh", "-c", "install_deps() { apk add --no-cache git libzip libzip-dev zlib-dev icu icu-dev unzip libpng libjpeg-turbo libwebp freetype; }; install_deps && curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer && composer \"$@\"; } \"$@\""]

  mysql:
    image: mysql:${MYSQL_IMAGE_TAG}
    restart: unless-stopped
    env_file:
      - ./mysql/.env
    volumes:
      - ./mysql_dev_data:/var/lib/mysql
    networks:
      - laravel-docker
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

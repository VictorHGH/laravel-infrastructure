networks:
  laravel-docker:
    name: "${PROJECT_NAME}-net"
  dokploy-network:
    external: true

services:

  server:
    build:
      context: .
      dockerfile: dockerfiles/nginx.dockerfile
      args:
        NGINX_BASE_IMAGE: ${NGINX_BASE_IMAGE}
    ports:
      - "${WEB_PORT}:8080"
    depends_on:
      php:
        condition: service_started
    networks:
      - laravel-docker
      - dokploy-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

  php:
    build:
      context: .
      dockerfile: dockerfiles/php.dockerfile
      target: app
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
        INSTALL_XDEBUG: "false"
        PHP_BASE_IMAGE: ${PHP_BASE_IMAGE}
        XDEBUG_VERSION: ${XDEBUG_VERSION}
        REDIS_PECL_VERSION: ${REDIS_PECL_VERSION}
        COMPOSER_IMAGE_TAG: ${COMPOSER_IMAGE_TAG}
    environment:
      APP_NAME: ${APP_NAME}
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: ${MYSQL_DATABASE}
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL}
      CACHE_DRIVER: ${CACHE_DRIVER:-file}
      SESSION_DRIVER: ${SESSION_DRIVER:-file}
      ADMIN1_NAME: ${ADMIN1_NAME}
      ADMIN1_EMAIL: ${ADMIN1_EMAIL}
      ADMIN1_PASSWORD: ${ADMIN1_PASSWORD}
      ADMIN2_NAME: ${ADMIN2_NAME}
      ADMIN2_EMAIL: ${ADMIN2_EMAIL}
      ADMIN2_PASSWORD: ${ADMIN2_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - laravel-docker
    restart: unless-stopped

  mysql:
    image: mysql:${MYSQL_IMAGE_TAG}
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - laravel-docker
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  mysql_data:
    name: "${PROJECT_NAME}-mysql-data"
